name: refresh

on:
  schedule:
    - cron: "*/15 * * * *"     # 15분마다
  workflow_dispatch:            # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 수집
        env:
          SLACK_TOKEN:   ${{ secrets.SLACK_TOKEN }}
          ICAL_URL:      ${{ secrets.ICAL_URL }}        # 구글 캘린더 비공개 iCal 주소
          TG_MEMO_TOKEN: ${{ secrets.TG_MEMO_TOKEN }}   # 메모 전용 텔레그램 봇 토큰
          DATA_DIR: ${{ github.workspace }}/data
          PUBLIC_MODE: "1"
          ONCE: "1"
          DAYS: "30"
          PLAN_DAYS: "21"
        run: python3 refresh.py

      - name: 커밋
        run: |
          git config user.name  "atteze-bot"
          git config user.email "bot@atteze.com"
          git add data/ops.json data/inbox.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 자비스가 같은 시각에 메모를 커밋했을 수 있으니 먼저 받아서 얹습니다
          git pull --rebase origin main || true
          git push
